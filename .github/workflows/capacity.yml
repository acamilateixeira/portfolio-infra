name: Teste de capacidade

# Sobe os backends como iriam para a VM Oracle A1, todos dentro de um cgroup
# com o teto da VM (2 CPUs, 12 GiB, sem swap), aplica carga com k6 de fora do
# teto e registra CPU, memória, I/O, disco, latência e erros. Ver docs/capacity.md.

on:
  workflow_dispatch:
    inputs:
      tripflow_ref:
        description: Branch, tag ou commit do TripFlow
        default: main
      rates:
        description: Degraus de carga (iterações por segundo)
        default: "2,5,10,15"
      stage_seconds:
        description: Duração de cada degrau (s)
        default: "120"
  pull_request:
    paths:
      - "capacity/**"
      - ".github/workflows/capacity.yml"

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tripflow:
    name: TripFlow sob o teto da VM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CPUS: "2"
      MEM_GIB: "12"
      RATES: ${{ inputs.rates || '2,5,10,15' }}
      # Em PR o degrau é menor para não prender o runner; a execução manual usa 120 s.
      STAGE_SECONDS: ${{ inputs.stage_seconds || '60' }}
      OUT: ${{ github.workspace }}/results
      TRIPFLOW_SRC: ${{ github.workspace }}/tripflow
      COMPOSE_FILE: capacity/tripflow/compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Checkout do TripFlow
        uses: actions/checkout@v7
        with:
          repository: acamilateixeira/Tripflow
          ref: ${{ inputs.tripflow_ref || 'main' }}
          path: tripflow

      - name: Teto da VM em cgroup (2 CPUs, 12 GiB)
        run: sudo -E bash capacity/scripts/setup-cgroup.sh "$CPUS" "$MEM_GIB"

      - name: Build da imagem de produção do TripFlow
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          APP_KEY=build docker compose build --pull

      - name: Subir a stack (com amostragem desde o boot)
        run: |
          mkdir -p "$OUT"
          echo boot > "$OUT/phase"
          nohup bash capacity/scripts/sample.sh > "$OUT/sampler.log" 2>&1 &
          # Workers só depois das migrações: o relay consulta a outbox assim que sobe
          # e entraria em loop de reinício com o banco vazio.
          docker compose up -d --wait --wait-timeout 300 mysql redis rabbitmq api
          docker compose exec -T api php artisan migrate --force
          docker compose exec -T api php /capacity/seed.php | tee "$OUT/seed.json"
          docker compose up -d worker outbox-relay consumer
          sleep 10
          docker compose ps --format '{{.Service}} {{.State}} {{.Status}}' | tee "$OUT/ps-start.txt"
          if grep -vq ' running ' "$OUT/ps-start.txt"; then echo "serviço fora do ar logo após subir" >&2; docker compose logs --tail 50; exit 1; fi
          echo "CC_IDS=$(jq -r '.cost_center_ids | join(",")' "$OUT/seed.json")" >> "$GITHUB_ENV"
          curl -fsS http://127.0.0.1:8000/api/health | tee "$OUT/health-before.json"

      - name: Linha de base ociosa (60 s)
        run: |
          echo idle > "$OUT/phase"
          sleep 60

      - uses: grafana/setup-k6-action@v1

      - name: Carga em degraus
        id: k6
        continue-on-error: true
        run: |
          echo "LOAD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo load > "$OUT/phase"
          k6 run --quiet \
            -e BASE_URL=http://127.0.0.1:8000/api \
            -e CC_IDS="$CC_IDS" -e RATES="$RATES" -e STAGE_SECONDS="$STAGE_SECONDS" \
            -e SUMMARY_PATH="$OUT/k6-summary.json" \
            capacity/k6/tripflow.js

      - name: Drenagem e consistência (outbox, inbox, estados)
        if: always()
        run: |
          echo drain > "$OUT/phase"
          sleep 30
          sql() { docker compose exec -T mysql mysql -N -utripflow -psecret tripflow -e "$1" 2>/dev/null; }
          {
            echo "outbox_pendente=$(sql 'select count(*) from outbox_messages where published_at is null')"
            echo "outbox_publicada=$(sql 'select count(*) from outbox_messages where published_at is not null')"
            echo "outbox_esgotada=$(sql 'select count(*) from outbox_messages where published_at is null and last_error is not null')"
            echo "inbox_processada=$(sql 'select count(*) from processed_messages')"
            echo "solicitacoes_por_status:"
            sql 'select status, count(*) from travel_requests group by status'
          } | tee "$OUT/consistency.txt"
          curl -fsS http://127.0.0.1:8000/api/health | tee "$OUT/health-after.json" || true

      - name: Encerrar amostragem, disco e reinícios
        if: always()
        run: |
          touch "$OUT/stop"
          sleep 5
          {
            echo "# docker system df -v (volumes e imagens)"
            docker system df -v | sed -n '/^Local Volumes/,/^Build cache/p'
            echo
            echo "# Tamanho dos dados dentro dos contêineres"
            docker compose exec -T mysql du -sh /var/lib/mysql 2>/dev/null || true
            docker compose exec -T rabbitmq du -sh /var/lib/rabbitmq 2>/dev/null || true
          } > "$OUT/disk.txt"
          docker compose ps -q | xargs docker inspect -f '{{.Name}} restarts={{.RestartCount}} oom_killed={{.State.OOMKilled}} status={{.State.Status}}' | tee "$OUT/containers-final.txt"
          docker compose logs --no-color --timestamps > "$OUT/compose.log" 2>&1 || true

      - name: Relatório
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, platform, subprocess
          env = os.environ
          def git(path): return subprocess.run(["git", "-C", path, "rev-parse", "--short", "HEAD"], capture_output=True, text=True).stdout.strip()
          mem_kib = int(next(l for l in open("/proc/meminfo") if l.startswith("MemTotal")).split()[1])
          meta = {
              "stack": ["TripFlow (API, worker, relay, consumidor, MySQL, Redis, RabbitMQ)"],
              "date": subprocess.run(["date", "-u", "+%Y-%m-%d %H:%M UTC"], capture_output=True, text=True).stdout.strip(),
              "harness_commit": git("."), "tripflow_commit": git("tripflow"),
              "runner": f"GitHub Actions {env.get('ImageOS', 'ubuntu')} {env.get('ImageVersion', '')}".strip(),
              "arch": platform.machine(), "host_cpus": os.cpu_count(), "host_mem_gib": round(mem_kib / 1024 / 1024, 1),
              "cpus": int(env["CPUS"]), "mem_gib": int(env["MEM_GIB"]),
              "rates": [int(x) for x in env["RATES"].split(",")], "stage_seconds": int(env["STAGE_SECONDS"]),
              "load_start_ms": int(env["LOAD_START_MS"]) if env.get("LOAD_START_MS") else None,
          }
          json.dump(meta, open(os.path.join(env["OUT"], "meta.json"), "w"), indent=2)
          EOF
          RESULTS="$OUT" python3 capacity/scripts/report.py > /dev/null
          cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '## Consistência após a carga'; echo; echo '```'; cat "$OUT/consistency.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capacity-tripflow-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Critérios de aceite
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          out = os.environ["OUT"]
          report = json.load(open(f"{out}/report.json"))
          problems = []
          if report["kernel"]["oom_kills"]:
              problems.append(f"{report['kernel']['oom_kills']} processo(s) morto(s) por falta de memória no cgroup")
          for line in open(f"{out}/containers-final.txt"):
              if re.search(r"restarts=[1-9]|oom_killed=true|status=(?!running)", line):
                  problems.append(f"contêiner instável: {line.strip()}")
          for stage in report["stages"]:
              if stage["error_rate_pct"] > 1:
                  problems.append(f"{stage['stage']}: {stage['error_rate_pct']}% de erros")
          pending = next((l.split("=")[1] for l in open(f"{out}/consistency.txt") if l.startswith("outbox_pendente=")), "?")
          if pending not in ("0", ""):
              problems.append(f"outbox com {pending} evento(s) não publicados 30 s após a carga")
          if os.environ.get("K6_OUTCOME") == "failure":
              problems.append("o k6 terminou com erro")
          if problems:
              print("Reprovado:\n- " + "\n- ".join(problems))
              sys.exit(1)
          print("Aprovado: sem OOM, sem reinícios, erros ≤ 1% em todos os degraus e outbox drenada.")
          EOF
        env:
          K6_OUTCOME: ${{ steps.k6.outcome }}

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v --remove-orphans
